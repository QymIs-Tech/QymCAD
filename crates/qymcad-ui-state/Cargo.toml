[package]
name = "qymcad-ui-state"
version = "0.1.0"
edition = "2021"
license.workspace = true

# THE STATE OF THE INTERFACE, AND NOTHING ELSE. Eighty records: the tools with parameters of their own,
# the selection, the view, the caches, the settings. It draws nothing, decides nothing and knows no
# workbench - it is what the workbenches EDIT.
#
# WHY IT IS A CRATE. Every workbench context is built out of these records. While they were declared
# beside the application, a workbench could not become a crate of its own: it would have to depend on the
# crate holding the god object, which is the very dependency the rebuild is undoing.
#
# The dependencies are the document (records hold ids, planes, references), the kernel (a live shape is
# cached by body), the shell (the layout of panels travels in the settings) and egui (a texture handle
# and a couple of screen types). Nothing here reaches for the application.
[dependencies]
ab_glyph = "0.2.32"
egui = "0.35"
egui-phosphor = "0.13"
serde = { version = "1", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
qymcad-core = { path = "../qymcad-core" }
qymcad-kernel = { path = "../qymcad-kernel" }
qymcad-shell = { path = "../qymcad-shell" }
qymcad-scheme = { path = "../qymcad-scheme" }
qymcad-i18n = { path = "../qymcad-i18n" }
ron = { workspace = true }
unic-langid = "0.9.6"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.39.4"
sha2 = "0.10.8"

[build-dependencies]
ron = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10.8"

[dev-dependencies]
egui_extras = { version = "0.35", features = ["svg"] }

[lints]
workspace = true
