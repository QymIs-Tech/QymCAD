[package]
name = "qymcad-assembly"
version = "0.1.0"
edition = "2021"

# THE ASSEMBLY WORKBENCH. Joints and mates: creating them, picking their anchors, dragging the gizmo,
# animating a degree of freedom, the list of relations. It works over `JointCtx` and asks nothing of the
# application.
#
# It does not depend on the Sketch nor on the Part: what the three have in common lives in the modules
# below them (the records, the picking, the drawing).
[dependencies]
egui = "0.35"
egui-phosphor = "0.11"
qymcad-core = { path = "../qymcad-core" }
qymcad-ui-state = { path = "../qymcad-ui-state" }
qymcad-pick = { path = "../qymcad-pick" }
qymcad-render = { path = "../qymcad-render" }
qymcad-i18n = { path = "../qymcad-i18n" }

[lints]
workspace = true
