[package]
name = "qymcad-shell"
version = "0.1.0"
edition = "2021"

# THE INTERFACE SHELL, AND NOTHING ELSE. It draws containers and hands out the `Ui` inside them; it draws
# nothing itself and knows no workbench. Hence the single dependency: a shell that reached for the document
# or the kernel would be a workbench wearing a shell's name.
[dependencies]
egui = "0.35"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
