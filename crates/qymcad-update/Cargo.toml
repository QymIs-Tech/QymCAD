[package]
name = "qymcad-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# THE ONLY NETWORK CLIENT IN THE PROGRAM, and it is deliberately a small one.
#
# Chosen over `reqwest` by weight rather than by taste: 5 required dependencies against 21, and no
# asynchronous runtime. `reqwest` pulls `tokio` even in its blocking mode, which would put a whole
# runtime into a window program that has not one asynchronous line; the background work here goes on
# ordinary threads, the way the file jobs already do.
#
# Default features are `rustls` and `gzip`, and `rustls` already brings `webpki-roots` - the roots
# compiled INTO the binary. That is the point: the AppImage and the package must behave the same on a
# machine whose system store is empty or stale. `platform-verifier` is a separate feature and stays off.
ureq = "3.4.1"
serde = { workspace = true }
serde_json = "1.0.151"
# READING THE WINDOWS PORTABLE ARCHIVE, and writing the small ones the tests stage with.
#
# The release run packs the portable copy as a zip of its own folder, so an update of such a copy
# is an unpacking over that folder. The same spec `qymcad-io` already carries (`deflate` and nothing
# else): reading what `Compress-Archive` wrote and writing test archives needs no more.
zip = { version = "8", default-features = false, features = ["deflate"] }
